name: Build Astro IPA on GitHub

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build for iPhone (unsigned)
        run: >-
          xcodebuild
          -project Astro.xcodeproj
          -scheme Astro
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
          build

      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Astro.app package/Payload/
          (cd package && zip -qr ../Astro-unsigned.ipa Payload)

      - name: Save iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: Astro-unsigned-IPA
          path: Astro-unsigned.ipa
