name: Build Astro on macOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project Astro.xcodeproj
          -scheme Astro
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Save simulator build
        uses: actions/upload-artifact@v4
        with:
          name: Astro-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/Astro.app
